<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PHOTOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 400;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-deco {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-deco .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.4;
            animation: blobFloat 18s ease-in-out infinite alternate;
        }

        .bg-deco .blob-1 {
            width: 420px; height: 420px;
            background: #a8c8ff;
            top: -160px; left: -160px;
            animation-delay: 0s;
        }

        .bg-deco .blob-2 {
            width: 380px; height: 380px;
            background: #ffb3c1;
            bottom: -160px; right: -140px;
            animation-delay: 6s;
        }

        @keyframes blobFloat {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(24px, -24px); }
        }

        .content { position: relative; z-index: 1; }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        header {
            text-align: center;
            padding: 110px 20px 50px;
            position: relative;
        }

        header h1 {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #111;
            position: relative;
            display: inline-block;
        }

        header h1 .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(34px) rotateX(35deg);
            filter: blur(8px);
            animation: charIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes charIn {
            0%   { opacity: 0; transform: translateY(34px) rotateX(35deg); filter: blur(8px); }
            60%  { opacity: 1; transform: translateY(-6px) rotateX(0); filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) rotateX(0); filter: blur(0); }
        }

        header h1 .char.space { width: 0.28em; }

        .subtitle {
            margin-top: 26px;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #999;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .rule {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #a8c8ff, #d0b8ff, #ffb3c1);
            margin: 40px auto 0;
            animation: ruleGrow 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) 1.1s forwards;
        }

        @keyframes ruleGrow {
            to { width: 60px; }
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 26px 20px 0;
            opacity: 0;
            animation: fadeIn 0.8s ease 1.4s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .tabs button {
            padding: 8px 22px;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: color 0.25s ease, border-color 0.25s ease;
        }

        .tabs button:hover { color: #555; }

        .tabs button.active {
            color: #111;
            border-bottom-color: #111;
        }

        .counter {
            text-align: center;
            padding: 18px 20px 6px;
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .counter.visible { opacity: 1; }

        .gallery {
            columns: 3;
            column-gap: 18px;
            padding: 34px 28px 20px;
            max-width: 1280px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) { .gallery { columns: 2; } }
        @media (max-width: 600px) { .gallery { columns: 1; } }

        .card {
            break-inside: avoid;
            margin-bottom: 18px;
            background: #fff;
            border: 1px solid #f0f0f3;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            transition: box-shadow 0.35s ease, transform 0.35s ease;
        }

        .card.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: fadeUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
            60%  { opacity: 1; transform: translateY(-6px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
        }

        .card img, .card video {
            width: 100%;
            display: block;
        }

        .card .info {
            padding: 14px 18px 16px;
        }

        .card .info h3 {
            font-size: 0.92rem;
            font-weight: 500;
            color: #222;
            margin-bottom: 3px;
        }

        .card .info p {
            font-size: 0.72rem;
            color: #aaa;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.97);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox.active #lightbox-content img,
        .lightbox.active #lightbox-content video {
            opacity: 0;
            transform: scale(0.92);
            animation: lightboxIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes lightboxIn {
            to { opacity: 1; transform: scale(1); }
        }

        .lightbox img, .lightbox video {
            max-width: 90vw;
            max-height: 82vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        }

        .lightbox .close {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 1.6rem;
            font-weight: 300;
            color: #555;
            cursor: pointer;
            z-index: 1001;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.25s ease;
        }

        .lightbox .close:hover {
            background: #f0f0f0;
            color: #000;
        }

        .empty-msg {
            text-align: center;
            padding: 100px 20px;
            color: #bbb;
            grid-column: 1 / -1;
        }

        .empty-msg h2 {
            font-size: 1.4rem;
            font-weight: 400;
            color: #999;
            margin-bottom: 10px;
        }

        .empty-msg p { font-size: 0.85rem; line-height: 1.8; }

        .empty-msg code {
            background: #f2f2f2;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        footer {
            text-align: center;
            padding: 60px 20px 70px;
            color: #ccc;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        footer span { color: #111; font-weight: 500; }
    </style>
</head>
<body>

<div class="bg-deco">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div class="content">
    <header>
        <h1 id="animated-title">MY PHOTOS</h1>
        <p class="subtitle">a collection of moments</p>
    </header>

    <div class="rule"></div>

    <div class="tabs">
        <button class="active" onclick="filterMedia('all', this)">All</button>
        <button onclick="filterMedia('photo', this)">Photos</button>
        <button onclick="filterMedia('video', this)">Videos</button>
    </div>

    <div class="counter" id="counter"></div>

    <div class="gallery" id="gallery">
        <div class="empty-msg">
            <h2>Your gallery is empty</h2>
            <p>Add your photos and videos to the <code>media/</code> folder<br>and update the items in <code>index.html</code>.</p>
        </div>
    </div>

    <footer>
        Made with <span>&hearts;</span> &mdash; MY PHOTOS
    </footer>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <div id="lightbox-content"></div>
</div>

<script>
    const mediaItems = [
        { type: "photo", src: "media/photo1.jpg", title: "Photo 1", date: "Aug 2026" },
        { type: "photo", src: "media/photo2.jpg", title: "Photo 2", date: "Aug 2026" },
        { type: "photo", src: "media/photo3.jpg", title: "Photo 3", date: "Aug 2026" },
        { type: "photo", src: "media/photo4.jpg", title: "Photo 4", date: "Aug 2026" },
        { type: "photo", src: "media/photo5.jpg", title: "Photo 5", date: "Aug 2026" },
        { type: "photo", src: "media/photo6.jpg", title: "Photo 6", date: "Aug 2026" },
        { type: "photo", src: "media/photo7.jpg", title: "Photo 7", date: "Aug 2026" },
    ];

    let currentFilter = 'all';

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        const counter = document.getElementById('counter');
        const filtered = currentFilter === 'all'
            ? mediaItems
            : mediaItems.filter(item => item.type === currentFilter);

        counter.textContent = filtered.length > 0
            ? `${filtered.length} ${currentFilter === 'all' ? 'items' : currentFilter + 's'}`
            : '';
        counter.classList.toggle('visible', filtered.length > 0);

        if (filtered.length === 0) {
            gallery.innerHTML = `
                <div class="empty-msg">
                    <h2>Your gallery is empty</h2>
                    <p>Add your photos and videos to the <code>media/</code> folder<br>and update the items in <code>index.html</code>.</p>
                </div>`;
            return;
        }

        gallery.innerHTML = filtered.map((item, index) => {
            if (item.type === 'video') {
                return `
                    <div class="card" onclick="openLightbox(${mediaItems.indexOf(item)})" style="animation-delay:${index * 0.07}s">
                        <video src="${item.src}" muted preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0;"></video>
                        <div class="info">
                            <h3>${item.title}</h3>
                            <p>${item.date} &bull; Video</p>
                        </div>
                    </div>`;
            }
            return `
                <div class="card" onclick="openLightbox(${mediaItems.indexOf(item)})" style="animation-delay:${index * 0.07}s">
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="info">
                        <h3>${item.title}</h3>
                        <p>${item.date} &bull; Photo</p>
                    </div>
                </div>`;
        }).join('');
        observeCards();
    }

    function filterMedia(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery();
    }

    function openLightbox(index) {
        const item = mediaItems[index];
        const content = document.getElementById('lightbox-content');
        const lightbox = document.getElementById('lightbox');

        if (item.type === 'video') {
            content.innerHTML = `<video src="${item.src}" controls autoplay style="max-width:90vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.18);"></video>`;
        } else {
            content.innerHTML = `<img src="${item.src}" alt="${item.title}" style="max-width:90vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.18);">`;
        }
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        const content = document.getElementById('lightbox-content');
        lightbox.classList.remove('active');
        content.innerHTML = '';
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    function animateTitle() {
        const el = document.getElementById('animated-title');
        const text = el.textContent;
        el.innerHTML = '';
        [...text].forEach((char, i) => {
            const span = document.createElement('span');
            span.className = char === ' ' ? 'char space' : 'char';
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.animationDelay = `${i * 0.07}s`;
            el.appendChild(span);
        });
    }
    animateTitle();

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('revealed');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.15 });

    function observeCards() {
        document.querySelectorAll('.card:not(.revealed)').forEach(card => {
            observer.observe(card);
        });
    }

    renderGallery();
</script>

</body>
</html>
