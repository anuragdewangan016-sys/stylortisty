<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PHOTOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cinzel:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Jost', sans-serif;
            background: #050510;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content { position: relative; z-index: 1; }

        header {
            text-align: center;
            padding: 100px 20px 60px;
            position: relative;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe, #00f2fe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease infinite;
            letter-spacing: 8px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            font-style: italic;
        }

        header h1 .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(60px) rotateX(-90deg);
            animation: charReveal 0.6s forwards;
        }

        @keyframes charReveal {
            0% { opacity: 0; transform: translateY(60px) rotateX(-90deg); }
            60% { opacity: 1; transform: translateY(-8px) rotateX(10deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        header h1 .char.space { width: 0.3em; }

        header h1::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
            border-radius: 2px;
            animation: lineGrow 0.8s 1.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes lineGrow {
            to { width: 120px; }
        }

        .subtitle {
            margin-top: 30px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #777;
            opacity: 0;
            animation: fadeIn 1s 1.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        header .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbPulse 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        header .glow-orb:nth-child(1) {
            width: 200px; height: 200px;
            background: #f093fb;
            top: 10%; left: 15%;
            animation-delay: 0s;
        }

        header .glow-orb:nth-child(2) {
            width: 160px; height: 160px;
            background: #4facfe;
            top: 20%; right: 20%;
            animation-delay: 2s;
        }

        @keyframes orbPulse {
            0% { opacity: 0.15; transform: scale(1); }
            100% { opacity: 0.35; transform: scale(1.2); }
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 1s 2s forwards;
        }

        .divider span {
            width: 4px;
            height: 4px;
            background: linear-gradient(135deg, #f093fb, #4facfe);
            border-radius: 50%;
            animation: dotPulse 2s infinite;
        }

        .divider span:nth-child(2) { animation-delay: 0.3s; }
        .divider span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(5, 5, 16, 0.6);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tabs button {
            padding: 10px 28px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: #999;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tabs button:hover {
            color: #fff;
            border-color: rgba(240, 147, 251, 0.4);
            background: rgba(240, 147, 251, 0.08);
        }

        .tabs button.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(240,147,251,0.2), rgba(79,172,254,0.2));
            border-color: rgba(240,147,251,0.5);
            box-shadow: 0 0 20px rgba(240,147,251,0.15);
        }

        .gallery {
            columns: 3;
            column-gap: 16px;
            padding: 40px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) { .gallery { columns: 2; } }
        @media (max-width: 600px) { .gallery { columns: 1; } }

        .card {
            break-inside: avoid;
            margin-bottom: 16px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(60px) scale(0.95);
        }

        .card.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: fadeUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(60px) scale(0.95); }
            60% { opacity: 1; transform: translateY(-6px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(240,147,251,0.3), rgba(79,172,254,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: 2;
        }

        .card:hover::before { opacity: 1; }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.4),
                0 0 40px rgba(240,147,251,0.1),
                0 0 80px rgba(79,172,254,0.05);
        }

        .card img, .card video {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover img, .card:hover video {
            transform: scale(1.05);
        }

        .card .info {
            padding: 16px 20px;
            position: relative;
        }

        .card .info::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240,147,251,0.3), transparent);
        }

        .card .info h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            font-style: italic;
            margin-bottom: 4px;
            color: #eee;
        }

        .card .info p {
            font-family: 'Jost', sans-serif;
            color: #666;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(30px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox img, .lightbox video {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(240,147,251,0.15);
        }

        .lightbox .close {
            position: absolute;
            top: 24px; right: 32px;
            font-size: 2.5rem;
            color: #666;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .lightbox .close:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .empty-msg {
            text-align: center;
            padding: 120px 20px;
            color: #444;
            grid-column: 1 / -1;
        }

        .empty-msg h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-style: italic;
            margin-bottom: 12px;
            color: #555;
        }

        .empty-msg p { color: #333; line-height: 1.6; }

        .empty-msg code {
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            padding: 40px 20px 60px;
            color: #333;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        footer span {
            background: linear-gradient(135deg, #f093fb, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 500;
        }

        .counter {
            text-align: center;
            padding: 10px;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="content">
    <header>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <h1 id="animated-title">MY PHOTOS</h1>
        <p class="subtitle">a collection of moments</p>
    </header>

    <div class="divider">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="tabs">
        <button class="active" onclick="filterMedia('all', this)">All</button>
        <button onclick="filterMedia('photo', this)">Photos</button>
        <button onclick="filterMedia('video', this)">Videos</button>
    </div>

    <div class="counter" id="counter"></div>

    <div class="gallery" id="gallery">
        <div class="empty-msg">
            <h2>Your gallery is empty</h2>
            <p>Add your photos and videos to the <code>media/</code> folder and update the items in <code>index.html</code>.</p>
        </div>
    </div>

    <footer>
        Made with <span>&hearts;</span> &mdash; MY PHOTOS
    </footer>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <div id="lightbox-content"></div>
</div>

<script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight * 3;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.1;
            this.hue = Math.random() > 0.5 ? 280 : 200;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    const mediaItems = [
        { type: "photo", src: "media/photo1.jpg", title: "Photo 1", date: "Aug 2026" },
        { type: "photo", src: "media/photo2.jpg", title: "Photo 2", date: "Aug 2026" },
        { type: "photo", src: "media/photo3.jpg", title: "Photo 3", date: "Aug 2026" },
        { type: "photo", src: "media/photo4.jpg", title: "Photo 4", date: "Aug 2026" },
        { type: "photo", src: "media/photo5.jpg", title: "Photo 5", date: "Aug 2026" },
        { type: "photo", src: "media/photo6.jpg", title: "Photo 6", date: "Aug 2026" },
        { type: "photo", src: "media/photo7.jpg", title: "Photo 7", date: "Aug 2026" },
    ];

    let currentFilter = 'all';

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        const counter = document.getElementById('counter');
        const filtered = currentFilter === 'all'
            ? mediaItems
            : mediaItems.filter(item => item.type === currentFilter);

        counter.textContent = filtered.length > 0 ? `${filtered.length} ${currentFilter === 'all' ? 'items' : currentFilter + 's'}` : '';

        if (filtered.length === 0) {
            gallery.innerHTML = `
                <div class="empty-msg">
                    <h2>Your gallery is empty</h2>
                    <p>Add your photos and videos to the <code>media/</code> folder<br>and update the items in <code>index.html</code>.</p>
                </div>`;
            return;
        }

        gallery.innerHTML = filtered.map((item, index) => {
            if (item.type === 'video') {
                return `
                    <div class="card" onclick="openLightbox(${mediaItems.indexOf(item)})" style="animation-delay:${index * 0.05}s">
                        <video src="${item.src}" muted preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0;"></video>
                        <div class="info">
                            <h3>${item.title}</h3>
                            <p>${item.date} &bull; Video</p>
                        </div>
                    </div>`;
            }
            return `
                <div class="card" onclick="openLightbox(${mediaItems.indexOf(item)})" style="animation-delay:${index * 0.05}s">
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="info">
                        <h3>${item.title}</h3>
                        <p>${item.date} &bull; Photo</p>
                    </div>
                </div>`;
        }).join('');
        observeCards();
    }

    function filterMedia(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery();
    }

    function openLightbox(index) {
        const item = mediaItems[index];
        const content = document.getElementById('lightbox-content');
        const lightbox = document.getElementById('lightbox');

        if (item.type === 'video') {
            content.innerHTML = `<video src="${item.src}" controls autoplay style="max-width:90vw;max-height:80vh;border-radius:12px;box-shadow:0 0 60px rgba(240,147,251,0.15);"></video>`;
        } else {
            content.innerHTML = `<img src="${item.src}" alt="${item.title}" style="max-width:90vw;max-height:80vh;border-radius:12px;box-shadow:0 0 60px rgba(240,147,251,0.15);">`;
        }
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        const content = document.getElementById('lightbox-content');
        lightbox.classList.remove('active');
        content.innerHTML = '';
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    function animateTitle() {
        const el = document.getElementById('animated-title');
        const text = el.textContent;
        el.innerHTML = '';
        [...text].forEach((char, i) => {
            const span = document.createElement('span');
            span.className = char === ' ' ? 'char space' : 'char';
            span.textContent = char === ' ' ? '' : char;
            span.style.animationDelay = `${i * 0.08}s`;
            el.appendChild(span);
        });
    }
    animateTitle();

    const revealables = document.querySelectorAll('.card');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('revealed');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.15 });

    function observeCards() {
        document.querySelectorAll('.card:not(.revealed)').forEach(card => {
            observer.observe(card);
        });
    }

    renderGallery();
    observeCards();
</script>

</body>
</html>
